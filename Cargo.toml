[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
license = "EUPL-1.2"

[workspace.dependencies]
# Pinned to the rc because 0.50 is where facet's current docs and the local
# checkout at /pool/dev/facet live; move to 0.50.0 once it's cut.
facet = { version = "=0.50.0-rc.7", features = ["reflect"] }

# The Spade compiler runs inside tests and generators; unoptimized it is slow
# and recurses deep enough to need a huge stack.
[profile.dev.package."*"]
opt-level = 2

# Upstream facet-core tags wide pointers with the address's top bit, which
# 32-bit ARM Linux user space uses; see vendor/README.md for the removal
# condition.
[patch.crates-io]
facet-core = { path = "vendor/facet-core" }
