[package]
name = "hello"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
facet.workspace = true
facet-hdl = { path = "../../crates/facet-hdl" }
facet-hdl-linux = { path = "../../crates/facet-hdl-linux" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
# Only the generator needs it, and the HPS binary mustn't cross-compile the
# whole Spade compiler.
facet-hdl-spade = { path = "../../crates/facet-hdl-spade", optional = true }

[features]
gen = ["dep:facet-hdl-spade"]

[[bin]]
name = "hello-gen"
required-features = ["gen"]

[dev-dependencies]
facet-hdl-spade = { path = "../../crates/facet-hdl-spade" }
facet-hdl-iverilog = { path = "../../crates/facet-hdl-iverilog" }

[[bin]]
name = "hello-de25"
required-features = ["gen"]
