[package]
name = "facet-hdl-spade"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Spade from a facet-hdl boundary, compiled to SystemVerilog in-process"

[dependencies]
facet-hdl = { path = "../facet-hdl" }
facet.workspace = true
thiserror = "2"
# Not on crates.io past 0.16, so straight from the repo, pinned to a release.
spade = { package = "spade-lang", git = "https://codeberg.org/spade-lang/spade.git", tag = "v0.21.0" }
spade-common = { git = "https://codeberg.org/spade-lang/spade.git", tag = "v0.21.0" }
spade-diagnostics = { git = "https://codeberg.org/spade-lang/spade.git", tag = "v0.21.0" }
spade-codespan-reporting = "0.12"

[dev-dependencies]
facet-hdl-iverilog = { path = "../facet-hdl-iverilog" }
